# NUR für die lokale Entwicklung: startet eine Postgres-Datenbank auf deinem Rechner.
# Start:  docker compose up -d
# Stopp:  docker compose down        (Daten bleiben erhalten)
# Reset:  docker compose down -v     (Daten werden gelöscht)
#
# In Coolify wird diese Datei NICHT verwendet. Dort läuft die App aus dem Dockerfile
# und die Datenbank als "Managed Database" (siehe docs/02-coolify-deployment.md).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # Nur auf localhost gebunden, nicht von außen erreichbar.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
