# Läuft bei jedem Push auf main und bei jedem Pull Request.
# Prüft Regeln, Lint, Build und ob das Docker-Image gebaut werden kann.
name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets in der Git-Historie suchen (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --no-banner --redact

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Regelprüfung (AGENTS.md)
        run: npm run check

      - run: npm run lint

      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker-Image bauen (wie Coolify es tut)
        run: docker build -t app-test .
